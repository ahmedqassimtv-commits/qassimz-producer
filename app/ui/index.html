<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QASSIMZ Producer</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="alternate icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>

<div class="app">
  <aside class="side glass">
    <div class="brand pywebview-drag-region" title="اسحب لتحريك النافذة">
      <img src="logo.svg" alt="QASSIMZ Producer" onerror="this.onerror=null;this.src='logo.png'">
      <div><b>قَاسِمز</b><small>PRODUCER</small></div>
    </div>
    <nav id="mainNav"></nav>
    <div class="side-sec"><span>السلاسل</span><button id="addSeries" title="سلسلة جديدة"></button></div>
    <div class="series-list" id="seriesNav"></div>
    <div class="side-foot">
      <button class="ai-pill" id="aiPill"><i class="led" id="aiLed"></i><span class="ell" id="aiText">الذكاء الاصطناعي</span></button>
      <div class="foot-row">
        <button class="btn sm" id="btnSettings"></button>
        <button class="btn sm" id="btnGithub"></button>
        <button class="btn sm" id="btnSupport"></button>
      </div>
    </div>
  </aside>

  <div class="main-stage">
    <header class="topbar glass pywebview-drag-region" id="appTopbar">
      <div class="top-start no-drag">
        <span class="top-pill" id="topPageTitle">الرئيسية</span>
        <span class="top-ver">v1.1.0</span>
      </div>
      <div class="top-end no-drag">
        <button class="btn sm primary" id="topNewEp" type="button" title="حلقة جديدة (Ctrl+N)">＋ حلقة جديدة</button>
        <span class="win-sep"></span>
        <div class="win-controls">
          <button class="win-btn" id="winMin" type="button" title="تصغير" aria-label="تصغير">
            <svg viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <button class="win-btn" id="winMax" type="button" title="تكبير / استعادة" aria-label="تكبير">
            <svg viewBox="0 0 12 12"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          </button>
          <button class="win-btn win-close" id="winClose" type="button" title="إغلاق" aria-label="إغلاق">
            <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>

<div id="layer"></div>
<script src="app.js"></script>
</body>
</html>
