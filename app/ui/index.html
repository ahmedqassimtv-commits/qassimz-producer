<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QASSIMZ Producer</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><div class="grain"></div></div>

<div class="app">
  <aside class="side glass">
    <div class="brand">
      <img src="logo.png" alt="">
      <div><b>قَاسِمز</b><small>PRODUCER</small></div>
    </div>
    <nav id="mainNav"></nav>
    <div class="side-sec"><span>السلاسل</span><button id="addSeries" title="سلسلة جديدة"></button></div>
    <div class="series-list" id="seriesNav"></div>
    <div class="side-foot">
      <button class="ai-pill" id="aiPill"><i class="led" id="aiLed"></i><span class="ell" id="aiText">الذكاء الاصطناعي</span></button>
      <div class="foot-row">
        <button class="btn sm" id="btnSettings"></button>
        <button class="btn sm" id="btnGithub"></button>
        <button class="btn sm" id="btnSupport"></button>
      </div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="layer"></div>
<script src="app.js"></script>
</body>
</html>
