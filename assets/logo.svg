<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ccCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#591E16"/>
      <stop offset="55%" stop-color="#411713"/>
      <stop offset="100%" stop-color="#301815"/>
    </linearGradient>

    <radialGradient id="ccWash" cx="80%" cy="88%" r="68%">
      <stop offset="0%" stop-color="#FF5A36" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7656"/>
      <stop offset="100%" stop-color="#FA532F"/>
    </linearGradient>

    <linearGradient id="monoInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8466"/>
      <stop offset="48%" stop-color="#FF5A36"/>
      <stop offset="100%" stop-color="#FF5A36"/>
    </linearGradient>

    <clipPath id="squircleClip">
      <rect x="14" y="14" width="996" height="996" rx="222"/>
    </clipPath>
  </defs>

  <!-- Clipped Adobe CC x ArtCraft interior -->
  <g clip-path="url(#squircleClip)">
    <rect x="14" y="14" width="996" height="996" fill="url(#ccCore)"/>
    <rect x="14" y="14" width="996" height="996" fill="url(#ccWash)"/>
    <g>
      <line x1="208" y1="24" x2="208" y2="1000" stroke="#FFBDA8" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="208" x2="1000" y2="208" stroke="#FFBDA8" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="360" y1="24" x2="360" y2="1000" stroke="#FFBDA8" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="360" x2="1000" y2="360" stroke="#FFBDA8" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="512" y1="24" x2="512" y2="1000" stroke="#FFBDA8" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="512" x2="1000" y2="512" stroke="#FFBDA8" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="664" y1="24" x2="664" y2="1000" stroke="#FFBDA8" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="664" x2="1000" y2="664" stroke="#FFBDA8" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="816" y1="24" x2="816" y2="1000" stroke="#FFBDA8" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="816" x2="1000" y2="816" stroke="#FFBDA8" stroke-opacity="0.045" stroke-width="2"/>
    </g>
    <!-- Crisp flat Adobe CC colored frame inside the squircle -->
    <rect x="28" y="28" width="968" height="968" rx="208"
          fill="none" stroke="url(#rimInk)" stroke-width="28"/>
    <!-- Fine drafted architectural inner hairline -->
    <rect x="44" y="44" width="936" height="936" rx="192"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  </g>

  <!-- Crisp ArtCraft drafted ink outer boundary (ensures razor-sharp contrast on #F2F1EE paper) -->
  <rect x="14" y="14" width="996" height="996" rx="222"
        fill="none" stroke="#101014" stroke-opacity="0.88" stroke-width="8"/>

